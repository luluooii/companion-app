<script>
(function () {
  // 让旧页面始终显示“播放”按钮。
  // 真正的密钥和音色由 Vercel 后端环境变量读取。
  function keepVoiceEnabled() {
    if (typeof config !== 'object' || !config) return;

    if (!config.ttsAppId) {
      config.ttsAppId = 'vercel';
    }

    if (!config.ttsToken) {
      config.ttsToken = 'vercel';
    }

    if (!config.ttsSpeaker) {
      config.ttsSpeaker = 'S_dRt2Ozd82';
    }
  }

  keepVoiceEnabled();

  // 使用同一个播放器，避免 iPhone 在请求结束后拦截新播放器。
  var voiceAudio = document.createElement('audio');

  voiceAudio.preload = 'auto';
  voiceAudio.setAttribute('playsinline', '');
  voiceAudio.setAttribute('webkit-playsinline', '');
  voiceAudio.style.display = 'none';

  document.body.appendChild(voiceAudio);

  var voiceObjectUrl = '';
  var voiceUnlocked = false;
  var voiceUnlocking = false;

  // 一段真正无声的短 MP3，用于提前解锁 iPhone 音频。
  var SILENT_MP3 =
    'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA/+M4wAAAAAAAAAAAAEluZm8AAAAPAAAAAwAAAbAAqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dX/////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/+M4xAANaAKsAAAAACIAA/8AAAAAT//M4xBAAAA0gAAAAAPE';

  function unlockVoice() {
    if (voiceUnlocked || voiceUnlocking) {
      return;
    }

    voiceUnlocking = true;

    voiceAudio.pause();
    voiceAudio.src = SILENT_MP3;
    voiceAudio.muted = false;
    voiceAudio.volume = 1;
    voiceAudio.load();

    var promise = voiceAudio.play();

    if (promise && typeof promise.then === 'function') {
      promise
        .then(function () {
          voiceAudio.pause();
          voiceAudio.currentTime = 0;

          voiceUnlocked = true;
          voiceUnlocking = false;
        })
        .catch(function () {
          voiceUnlocking = false;
        });
    } else {
      voiceAudio.pause();
      voiceAudio.currentTime = 0;

      voiceUnlocked = true;
      voiceUnlocking = false;
    }
  }

  function resetButton(btn) {
    if (!btn) return;

    btn.classList.remove('audio-playing');

    btn.innerHTML =
      '<svg viewBox="0 0 24 24">' +
      '<polygon points="5 3 19 12 5 21 5 3"></polygon>' +
      '</svg>播放';
  }

  function clearOldAudio() {
    voiceAudio.pause();
    voiceAudio.onended = null;
    voiceAudio.onerror = null;

    if (voiceObjectUrl) {
      URL.revokeObjectURL(voiceObjectUrl);
      voiceObjectUrl = '';
    }
  }

  /*
   * 覆盖旧版播放函数。
   *
   * 这里不再读取手机本地缓存的 speaker，
   * 只发送文字，让 Vercel 后端使用正确的：
   *
   * DOUBAO_TTS_SPEAKER=S_dRt2Ozd82
   */
  window.playVoice = playVoice = function (text, btn) {
    unlockVoice();
    clearOldAudio();

    var cleanText = String(text || '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/\*[^*]*\*/g, '')
      .trim();

    if (!cleanText) {
      showToast('没有可播放的文字');
      resetButton(btn);
      return;
    }

    if (btn) {
      btn.classList.add('audio-playing');

      btn.innerHTML =
        '<svg viewBox="0 0 24 24">' +
        '<rect x="6" y="4" width="4" height="16"></rect>' +
        '<rect x="14" y="4" width="4" height="16"></rect>' +
        '</svg>播放中';
    }

    fetch('/api/tts', {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      // 不发送 speaker，避免旧缓存覆盖正确音色。
      body: JSON.stringify({
        text: cleanText
      })
    })
      .then(function (response) {
        if (!response.ok) {
          return response.text().then(function (body) {
            throw new Error(
              'HTTP ' + response.status + ': ' + body
            );
          });
        }

        return response.json();
      })
      .then(function (result) {
        var code = Number(result.code);

        var hasAudio =
          result.data ||
          result.audio ||
          result.audio_url ||
          result.audioUrl;

        // 同时兼容火山 V3 的 0 和旧前端的 3000。
        if (
          (code !== 0 && code !== 3000) ||
          !hasAudio
        ) {
          throw new Error(
            'TTS code: ' +
              result.code +
              ' msg: ' +
              (result.message || 'unknown')
          );
        }

        var directUrl =
          result.audio_url ||
          result.audioUrl ||
          '';

        if (directUrl) {
          voiceAudio.src = directUrl;
        } else {
          var base64 =
            result.data ||
            result.audio;

          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);

          for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }

          var blob = new Blob(
            [bytes],
            {
              type: 'audio/mpeg'
            }
          );

          voiceObjectUrl =
            URL.createObjectURL(blob);

          voiceAudio.src = voiceObjectUrl;
        }

        voiceAudio.muted = false;
        voiceAudio.volume = 1;
        voiceAudio.load();

        voiceAudio.onended = function () {
          resetButton(btn);
          clearOldAudio();
        };

        voiceAudio.onerror = function () {
          resetButton(btn);
          clearOldAudio();

          showToast(
            '语音生成成功，但 iPhone 没能解码音频'
          );
        };

        // 必须返回 Promise，才能看见 iPhone 的播放拦截错误。
        return voiceAudio.play();
      })
      .catch(function (error) {
        console.error(
          'TTS playback error:',
          error
        );

        resetButton(btn);

        if (
          error &&
          error.name === 'NotAllowedError'
        ) {
          showToast(
            'iPhone 拦截了自动播放，请点回复下面的“播放”'
          );
        } else {
          showToast(
            '语音: ' +
              (
                error && error.message
                  ? error.message
                  : String(error)
              )
          );
        }
      });
  };

  // 在发送消息之前解锁声音。
  document.addEventListener(
    'touchstart',
    unlockVoice,
    {
      once: true,
      passive: true
    }
  );

  document.addEventListener(
    'pointerdown',
    unlockVoice,
    {
      once: true,
      passive: true
    }
  );

  if (
    typeof btnSend !== 'undefined' &&
    btnSend
  ) {
    btnSend.addEventListener(
      'touchstart',
      unlockVoice,
      {
        passive: true
      }
    );

    btnSend.addEventListener(
      'pointerdown',
      unlockVoice,
      {
        passive: true
      }
    );
  }

  if (
    typeof inputField !== 'undefined' &&
    inputField
  ) {
    inputField.addEventListener(
      'keydown',
      function (event) {
        if (event.key === 'Enter') {
          unlockVoice();
        }
      }
    );
  }

  var saveButton =
    document.getElementById(
      'btnSaveConfig'
    );

  if (saveButton) {
    saveButton.addEventListener(
      'click',
      function () {
        setTimeout(
          keepVoiceEnabled,
          0
        );
      }
    );
  }

  // 重新显示历史消息，让旧回复下面也出现播放按钮。
  if (
    typeof reRenderChat === 'function'
  ) {
    reRenderChat();
  }
})();
</script>
</body>
</html>
